[remote.github]
owner = "MAA1999"
repo = "M9A"

[changelog]
header = """
# 更新日志 | Release Notes
"""

body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | upper_first }} \
        {% if commit.github.username %}@{{ commit.github.username }}{% else %}{{ commit.author.name }}{% endif %}
        {%- if commit.footers -%}
            {%- for footer in commit.footers -%}
                {%- if footer.token == "Co-authored-by" -%}
                    {%- set co_author_name = footer.value | split(pat=" <") | first | trim %} @{{ co_author_name }}
                {%- endif -%}
            {%- endfor -%}
        {%- endif %}
{% endmacro -%}

{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## 未发布 | Unreleased
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{%- if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ## 新贡献者 | New Contributors
{% endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in #{{ contributor.pr_number }}{% endif %}
{%- endfor -%}
{%- endif %}
"""

footer = """
{%- set latest_version = "" -%}
{%- for release in releases -%}
  {%- if release.version and latest_version == "" -%}
    {%- set_global latest_version = release.version -%}
  {%- endif -%}
{%- endfor -%}
{%- if latest_version -%}
  {%- set_global ver = latest_version -%}
{%- else -%}
  {%- set_global ver = "v?.?.?" -%}
{%- endif %}

{%- macro asset(prefix, suffix, ver, tag) -%}
  {%- set filename = prefix ~ ver ~ suffix -%}
  {%- if tag -%}
    [{{ filename }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/releases/download/{{ tag }}/{{ filename }})
  {%- else -%}
    {{ filename }}
  {%- endif -%}
{%- endmacro %}

---

### 下载哪个包

| 包 | 适用 |
| --- | --- |
| {{ self::asset(prefix="M9A-win-x86_64-", suffix="-MFAA.zip", ver=ver, tag=latest_version) }}（推荐） | Windows x64，绝大部分用户 |
| {{ self::asset(prefix="M9A-win-x86_64-", suffix="-MXU.zip", ver=ver, tag=latest_version) }} | Windows x64（MaaEnd 同款界面） |
| {{ self::asset(prefix="M9A-win-aarch64-", suffix="-MFAA.zip", ver=ver, tag=latest_version) }} / {{ self::asset(prefix="M9A-win-aarch64-", suffix="-MXU.zip", ver=ver, tag=latest_version) }} | Windows on ARM |
| {{ self::asset(prefix="M9A-linux-x86_64-", suffix="-MFAA.tar.gz", ver=ver, tag=latest_version) }} / {{ self::asset(prefix="M9A-linux-x86_64-", suffix="-MXU.tar.gz", ver=ver, tag=latest_version) }} | Linux x64 |
| {{ self::asset(prefix="M9A-linux-aarch64-", suffix="-MFAA.tar.gz", ver=ver, tag=latest_version) }} | Linux ARM64（无 MXU 包） |
| {{ self::asset(prefix="M9A-macos-x86_64-", suffix="-MFAA.tar.gz", ver=ver, tag=latest_version) }} / {{ self::asset(prefix="M9A-macos-x86_64-", suffix="-MXU.tar.gz", ver=ver, tag=latest_version) }} | macOS（Intel 芯片） |
| {{ self::asset(prefix="M9A-macos-aarch64-", suffix="-MFAA.tar.gz", ver=ver, tag=latest_version) }} / {{ self::asset(prefix="M9A-macos-aarch64-", suffix="-MXU.tar.gz", ver=ver, tag=latest_version) }} | macOS（Apple Silicon） |
| {{ self::asset(prefix="M9A-", suffix="-arm64-v8a.apk", ver=ver, tag=latest_version) }}（推荐） | Android 真机（ARM64），体积约为 universal 的一半 |
| {{ self::asset(prefix="M9A-", suffix="-universal.apk", ver=ver, tag=latest_version) }} | Android 双架构通用包，真机 / 模拟器都能装，不确定选这个 |
| {{ self::asset(prefix="M9A-", suffix="-x86_64.apk", ver=ver, tag=latest_version) }} | Android 模拟器等 x86 环境（Windows 上的蓝叠 / MuMu / 雷电等） |
{%- if not latest_version %}
以上版本号为占位 v?.?.?，release 页没找到对应包请点 show all assets
{%- endif %}

