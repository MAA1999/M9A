name: Daily Activity Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activities:
    runs-on: ubuntu-latest
    if: github.repository == 'MAA1999/M9A'

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f tools/activity_data/requirements.txt ]; then pip install -r tools/activity_data/requirements.txt; fi

      - name: Run Activity Update Script
        run: |
          python tools/activity_data/main.py

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity/*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "Auto-update activities data - $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 产生的 push 不会触发其它 workflow，
      # 因此这里显式向 M9A-API 发送 repository_dispatch 触发数据同步。
      - name: Trigger M9A-API Sync
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'MAA1999',
              repo: 'M9A-API',
              event_type: 'sync-resource-data',
              client_payload: {
                source_repo: context.repo.repo,
                source_ref: context.ref,
                triggered_by: context.actor
              }
            });
            console.log('已触发 M9A-API 仓库的数据同步');
