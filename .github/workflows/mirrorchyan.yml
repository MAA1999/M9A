name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ""
        required: false
      android:
        description: "一并上传 Android 的 M9A_exec 三个包"
        type: boolean
        default: false
  # Android 发布流程在 Release 里三个 APK 就位后同步调用这里。
  # 不能只靠下面的 release 事件：APK 与桌面包分属两个 workflow，
  # 事件会先于资产到达，按 filename 去 Release 里找会扑空。
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      android:
        required: true
        type: boolean
  repository_dispatch:
    types: [mirrorchyan-upload]
  release:
    types: [released]

jobs:
  mirrorchyan_mfa:
    runs-on: ubuntu-latest
    # Mirror酱为第三方分发服务，新项目默认关闭
    # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
    # https://mirrorchyan.com/
    if: ${{ github.repository_owner == 'MAA1999' && github.event_name != 'workflow_call' }}
    strategy:
      fail-fast: false
      matrix:
        os: [win, macos, linux]
        arch: [aarch64, x86_64]
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('M9A-{0}-{1}-*-MFAA*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: M9A
          tag: ${{ inputs.tag || github.event.client_payload.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: MAA1999
          repo: M9A
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  mirrorchyan_mxu:
    runs-on: ubuntu-latest
    # Mirror酱为第三方分发服务，新项目默认关闭
    # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
    # https://mirrorchyan.com/
    if: ${{ github.repository_owner == 'MAA1999' && github.event_name != 'workflow_call' }}
    strategy:
      fail-fast: false
      matrix:
        os: [win, macos, linux]
        arch: [aarch64, x86_64]
    steps:
      - uses: MirrorChyan/uploading-action@v1
        if: ${{ matrix.os != 'linux' || matrix.arch != 'aarch64' }}
        with:
          filetype: latest-release
          filename: ${{ format('M9A-{0}-{1}-*-MXU*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: M9A-MXU
          tag: ${{ inputs.tag || github.event.client_payload.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: MAA1999
          repo: M9A
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  # Android 的「可执行包」流：M9A_exec 与上面两条资源流不是同一个 rid。
  # 只在被调用或手动勾选 android 时跑，避免 release 事件下的资产时序问题。
  mirrorchyan_android:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'MAA1999' && (inputs.android == true || github.event.inputs.android == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: any
            suffix: universal
          - arch: arm64
            suffix: arm64-v8a
          - arch: x64
            suffix: x86_64
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('*-{0}.apk', matrix.suffix) }}
          mirrorchyan_rid: M9A_exec
          tag: ${{ inputs.tag || github.event.client_payload.tag }}

          os: android
          arch: ${{ matrix.arch }}

          owner: MAA1999
          repo: M9A
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
