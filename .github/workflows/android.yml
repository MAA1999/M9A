name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["android-v*"]
    paths:
      - "Android/**"
      - "agent/**"
      - "tasks/**"
      - "resource/**"
      - "data/**"
      - "locales/**"
      - "config/**"
      - "requirements.txt"
      - "interface.json"
      - "logo.ico"
      - "CONTACT"
      - "LICENSE"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
      - "agent/**"
      - "tasks/**"
      - "resource/**"
      - "data/**"
      - "locales/**"
      - "config/**"
      - "requirements.txt"
      - "interface.json"
      - "logo.ico"
      - "CONTACT"
      - "LICENSE"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      assemble:
        description: "debug 或 release"
        type: choice
        options:
          - debug
          - release
        default: debug
      maafw_tag:
        description: "MaaFramework release tag"
        required: false
        default: "latest"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # debug 与 release 共用一个 job，按较重的 release 取超时
    timeout-minutes: 90
    env:
      PI_PROFILE: ${{ github.workspace }}/Android/profile.yaml
      # workflow_dispatch 的 assemble 输入、android-v* tag 推送、其余事件，统一推导本次构建模式
      ASSEMBLE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.assemble) || (startsWith(github.ref, 'refs/tags/android-v') && 'release') || 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/MaaFwApp/**/*.gradle.kts', 'Android/MaaFwApp/**/gradle-wrapper.properties', 'Android/MaaFwApp/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache agent core
        uses: actions/cache@v6
        with:
          path: Android/MaaFwApp/.maafw
          key: maa-agent-core-${{ runner.os }}-${{ hashFiles('Android/MaaFwApp/scripts/build_agent_bundle.py') }}

      # agent-dist 只含 CPython + pip 依赖，与 agent/** 源码无关；agent/** 经
      # syncPiAssets 直接从工作区进 APK（永远是最新 commit），故缓存键不含 agent/**。
      - name: Cache agent bundle
        uses: actions/cache@v6
        with:
          path: Android/agent-dist
          key: m9a-agent-${{ runner.os }}-${{ hashFiles('requirements.txt', 'Android/MaaFwApp/scripts/build_agent_bundle.py') }}

      # 不缓存 MaaFramework zip：脚本按字典序部署缓存里全部 MAA-android-*.zip，
      # 跨 run 复用会让 workflow_dispatch 指定的 maafw_tag 被旧版本覆盖
      - name: Download and deploy MaaFramework
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAAFW_TAG: ${{ github.event.inputs.maafw_tag || 'latest' }}
        run: |
          TAG_ARG=""
          if [ -n "$MAAFW_TAG" ] && [ "$MAAFW_TAG" != "latest" ]; then
            TAG_ARG="--tag $MAAFW_TAG"
          fi
          python scripts/setup_maa_framework.py --abi arm64-v8a $TAG_ARG
          python scripts/setup_maa_framework.py --abi x86_64 $TAG_ARG

      - name: Build agent runtime
        working-directory: Android/MaaFwApp
        run: |
          if [ -x "${GITHUB_WORKSPACE}/Android/agent-dist/arm64-v8a/bundle/bin/python3" ] && \
             [ -x "${GITHUB_WORKSPACE}/Android/agent-dist/x86_64/bundle/bin/python3" ]; then
            echo "agent bundle cache hit"
            exit 0
          fi
          python scripts/build_agent_bundle.py \
            --out "${GITHUB_WORKSPACE}/Android/agent-dist" \
            --abi arm64-v8a --abi x86_64 \
            --requirements "${GITHUB_WORKSPACE}/requirements.txt" \
            --exclude pillow --require pillow==11.0.0 \
            --extra-index-url https://chaquo.com/pypi-13.1/

      # OCR 模型由 MaaCommonAssets 子模块提供、不进 git；与桌面流程同一机制，
      # 由 maa-project.json 的 ocr 字段驱动，无项目特定路径
      - name: Sync OCR models
        run: pnpm dlx create-maa-project@latest --update ocr-models

      - name: Write local.properties
        working-directory: Android/MaaFwApp
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "pi.profile=${PI_PROFILE}"
            if [ "$ASSEMBLE" != "release" ]; then
              echo "build.debugAbi=arm64-v8a"
            fi
          } > local.properties

      - name: Decode keystore
        if: env.ASSEMBLE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build Debug APK
        if: env.ASSEMBLE != 'release'
        working-directory: Android/MaaFwApp
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug

      - name: Build Release APK
        if: env.ASSEMBLE == 'release'
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Rename Release APK
        if: env.ASSEMBLE == 'release'
        run: |
          cd Android/MaaFwApp/app/build/outputs/apk/release
          TAG="${GITHUB_REF_NAME:-dev}"
          TAG="${TAG//\//-}"
          TAG="${TAG#android-}"
          # 名里不能带 ABI 标记：应用内更新按 asset 名选包（GitHubUpdate.selectAsset），
          # 带 arm64-v8a 会被当成拆分变体，x86_64 设备连 universal 回退都选不到
          for f in *.apk; do
            mv "$f" "M9A-${TAG}-universal.apk"
          done

      - name: Upload Debug APK
        if: env.ASSEMBLE != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: Android/MaaFwApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: env.ASSEMBLE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-universal
          path: Android/MaaFwApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: env.ASSEMBLE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: Android/MaaFwApp/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-apk-*
          merge-multiple: true
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: apks/*.apk
          generate_release_notes: true
