              "Name: maafw\n"
              f"Version: {version}\n"
              "Summary: MaaFramework Python binding, rebuilt for Android from the upstream tag\n"
              "Requires-Python: >=3.9\n"
          ).encode()
          payloads[f"{dist_info}/WHEEL"] = (
              "Wheel-Version: 1.0\n"
              "Generator: m9a-android-ci\n"
              "Root-Is-Purelib: true\n"
              "Tag: py3-none-any\n"
          ).encode()
          records = []
          for path, data in sorted(payloads.items()):
              digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
              records.append(f"{path},sha256={digest},{len(data)}")
          records.append(f"{dist_info}/RECORD,,")
          payloads[f"{dist_info}/RECORD"] = ("\n".join(records) + "\n").encode()

          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "maafw-wheel"
          out.mkdir(parents=True, exist_ok=True)
          wheel = out / f"maafw-{version}-py3-none-any.whl"
          with zipfile.ZipFile(wheel, "w", zipfile.ZIP_DEFLATED) as wheel_zip:
              for path, data in sorted(payloads.items()):
                  wheel_zip.writestr(path, data)
          print(f"built {wheel} ({wheel.stat().st_size / 1024:.0f} KB, {len(payloads)} entries)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"wheel={wheel}\n")
          PY

      - name: Download and deploy MaaFramework
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAAFW_TAG: ${{ github.event.inputs.maafw_tag || steps.maafw.outputs.maafw_tag }}
        run: |
          TAG_ARG=""
          if [ -n "$MAAFW_TAG" ] && [ "$MAAFW_TAG" != "latest" ]; then
            TAG_ARG="--tag $MAAFW_TAG"
          fi
          python scripts/setup_maa_framework.py --abi "$ABI" $TAG_ARG

      - name: Build agent runtime
        working-directory: Android/MaaFwApp
        run: |
          if [ -x "${GITHUB_WORKSPACE}/Android/agent-dist/${ABI}/bundle/bin/python3" ]; then
            echo "agent bundle cache hit"
            exit 0
          fi
          python scripts/build_agent_bundle.py \
            --out "${GITHUB_WORKSPACE}/Android/agent-dist" \
            --abi "$ABI" \
            --requirements "${GITHUB_WORKSPACE}/requirements.txt" \
            --exclude pillow --require pillow==11.0.0 \
            --require "${{ steps.maafw-wheel.outputs.wheel }}" \
            --extra-index-url https://chaquo.com/pypi-13.1/

      - name: Sync OCR models
        run: pnpm dlx create-maa-project@latest --update ocr-models

      # 配方里的 agent.abi 决定 bundle.zip 装哪些运行时，单 ABI 包必须同步收窄
      - name: Generate narrowed profile
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          abi = os.environ["ABI"]
          source = pathlib.Path("Android/profile.yaml")
          target = pathlib.Path(f"Android/profile-{abi}.yaml")
          text = source.read_text(encoding="utf-8")
          narrowed, count = re.subn(r"^(\s*)abi:\s*\[[^\]]*\]\s*$", rf"\1abi: [{abi}]", text, flags=re.M)
          if count != 1:
              raise SystemExit(f"配方里预期恰好一处 'abi: [...]'，实际匹配 {count} 处")
          target.write_text(narrowed, encoding="utf-8")
          print(f"{target} -> agent.abi: [{abi}]")
          PY

      - name: Write local.properties
        working-directory: Android/MaaFwApp
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "pi.profile=${PI_PROFILE}"
            echo "build.releaseAbi=${ABI}"
          } > local.properties

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build Release APK
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Rename Release APK
        run: |
          cd Android/MaaFwApp/app/build/outputs/apk/release
          TAG="${GITHUB_REF_NAME:-dev}"
          TAG="${TAG//\//-}"
          count=$(ls -1 ./*.apk 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "预期恰好一个 release APK，实际 $count 个"
            exit 1
          fi
          # 单 ABI 包必须带本机 ABI 标记，应用内更新才会优先选它
          mv ./*.apk "M9A-${TAG}-${ABI}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ matrix.abi }}
          path: Android/MaaFwApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, abi-split]
    runs-on: ubuntu-latest
    # 与桌面 Release workflow 认同一批 v* tag，两边会给同一个 Release 传资产；
    # 用同一个 concurrency group 串行化，避免并发创建同名 Release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-apk-*
          merge-multiple: true
          path: apks

      # 只传文件、不写正文：Release 说明与变更日志由桌面 Release 流程维护
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apks/*.apk
