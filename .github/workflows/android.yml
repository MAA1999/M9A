      # 而内核里那份 maa 本来就是纯 Python（无 .so，原生库由 APK 的 jniLibs 提供），
      # 所以按 requirements 的 pin 从上游 tag 重新打一个 py3-none-any 轮子交给 pip
      - name: Build Android maafw wheel
        id: maafw-wheel
        env:
          MAAFW_VERSION: ${{ steps.maafw.outputs.maafw_pin }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
