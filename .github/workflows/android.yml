name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "Android/**"
      - "agent/**"
      - "tasks/**"
      - "resource/**"
      - "data/**"
      - "locales/**"
      - "config/**"
      - "requirements.txt"
      - "interface.json"
      - "logo.ico"
      - "CONTACT"
      - "LICENSE"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
      - "agent/**"
      - "tasks/**"
      - "resource/**"
      - "data/**"
      - "locales/**"
      - "config/**"
      - "requirements.txt"
      - "interface.json"
      - "logo.ico"
      - "CONTACT"
      - "LICENSE"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      assemble:
        description: "debug 或 release"
        type: choice
        options:
          - debug
          - release
        default: debug
      maafw_tag:
        description: "MaaFramework release tag；留空则按 maa-project.json 的 maafw.channel/version 解析，填 latest 取 GitHub 最新正式版"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # debug 包，以及 release 时的 universal（双 ABI）包
  build:
    runs-on: macos-latest
    # debug 与 release 共用一个 job，按较重的 release 取超时
    timeout-minutes: 90
    env:
      PI_PROFILE: ${{ github.workspace }}/Android/profile.yaml
      # workflow_dispatch 的 assemble 输入、v* tag 推送、其余事件，统一推导本次构建模式
      ASSEMBLE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.assemble) || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'debug' }}
      # agent-dist / .maafw 缓存按 ABI 集合分开，避免与 abi-split 的任务互相覆盖
      CACHE_SCOPE: universal
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/MaaFwApp/**/*.gradle.kts', 'Android/MaaFwApp/**/gradle-wrapper.properties', 'Android/MaaFwApp/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache agent core
        uses: actions/cache@v6
        with:
          path: Android/MaaFwApp/.maafw
          key: maa-agent-core-${{ runner.os }}-${{ env.CACHE_SCOPE }}-${{ hashFiles('Android/MaaFwApp/scripts/build_agent_bundle.py') }}

      # agent-dist 只含 CPython + pip 依赖，与 agent/** 源码无关；agent/** 经
      # syncPiAssets 直接从工作区进 APK（永远是最新 commit），故缓存键不含 agent/**。
      - name: Cache agent bundle
        uses: actions/cache@v6
        with:
          path: Android/agent-dist
          key: m9a-agent-${{ runner.os }}-${{ env.CACHE_SCOPE }}-${{ hashFiles('requirements.txt', 'Android/MaaFwApp/scripts/build_agent_bundle.py') }}

      # 不缓存 MaaFramework zip：脚本按字典序部署缓存里全部 MAA-android-*.zip，
      # 跨 run 复用会让 workflow_dispatch 指定的 maafw_tag 被旧版本覆盖
      # client 侧（APK 里的 jniLibs）按桌面同一份 maa-project.json 的 maafw.channel/version
      # 解析版本；agent 侧（Python 的 maa 包）按 requirements.txt 的 pin——与桌面同样的分工
      - name: Resolve MaaFW version
        id: maafw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.request

          REPO = "MaaXYZ/MaaFramework"
          project = json.loads(pathlib.Path("maa-project.json").read_text(encoding="utf-8"))
          maafw = project.get("maafw") or {}
          channel = str(maafw.get("channel") or "stable").strip().lower()
          pinned = str(maafw.get("version") or "").strip()


          def pre_key(pre):
              if not pre:
                  return ()
              return tuple((0, int(part)) if part.isdigit() else (1, part) for part in pre.split("."))


          def sort_key(tag):
              match = re.match(r"^v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.\-]+))?$", tag)
              if not match:
                  return None
              major, minor, patch = (int(match.group(index)) for index in (1, 2, 3))
              pre = match.group(4)
              # 同一版本下预发布排在正式版之前
              return (major, minor, patch, 0 if pre else 1, pre_key(pre))


          def fetch_releases():
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "m9a-android-ci",
              }
              token = os.environ.get("GITHUB_TOKEN")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/releases?per_page=100", headers=headers
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)


          if pinned:
              tag = pinned if pinned.startswith("v") else f"v{pinned}"
          else:
              items = [
                  item
                  for item in fetch_releases()
                  if isinstance(item, dict)
                  and not item.get("draft")
                  and sort_key(str(item.get("tag_name", "")))
              ]
              # 只有 beta 通道收预发布，其余按正式版解析
              if channel != "beta":
                  items = [item for item in items if not item.get("prerelease")]
              if not items:
                  raise SystemExit(f"{channel} 通道里没有可用的 MaaFramework release")
              tag = max(items, key=lambda item: sort_key(item["tag_name"]))["tag_name"]

          requirements = pathlib.Path("requirements.txt").read_text(encoding="utf-8")
          match = re.search(r"^maafw==([0-9][^\s;]*)", requirements, flags=re.M)
          if not match:
              raise SystemExit("requirements.txt 里没有 maafw== 的精确 pin，agent 侧版本无法确定")
          pin = match.group(1)

          if tag.lstrip("v").split("-")[0] != pin:
              print(f"::warning::client {tag} 与 requirements 的 maafw=={pin} 不一致；agent 侧仍按 requirements 安装")
          print(f"client MaaFW tag: {tag}")
          print(f"agent maafw pin : {pin}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"maafw_tag={tag}\n")
              output.write(f"maafw_pin={pin}\n")
          PY

      # Android 没有公开的 maafw 轮子（CI 实测 maafw==5.13.0 在 Android tag 下解析不到任何版本），
      # 而内核里那份 maa 本来就是纯 Python（无 .so，原生库由 APK 的 jniLibs 提供），
      # 所以按 requirements 的 pin 从上游 tag 重新打一个 py3-none-any 轮子交给 pip
      - name: Build Android maafw wheel
        id: maafw-wheel
        env:
          MAAFW_VERSION: ${{ steps.maafw.outputs.maafw_pin }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import os
          import pathlib
          import tarfile
          import urllib.request
          import zipfile

          version = os.environ["MAAFW_VERSION"]
          tag = f"v{version}"
          url = f"https://github.com/MaaXYZ/MaaFramework/archive/refs/tags/{tag}.tar.gz"
          headers = {"User-Agent": "m9a-android-ci"}
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=180) as response:
              source = response.read()

          prefix = "source/binding/Python/maa/"
          payloads = {}
          with tarfile.open(fileobj=io.BytesIO(source), mode="r:gz") as tar:
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  name = member.name.split("/", 1)[-1]
                  if not name.startswith(prefix):
                      continue
                  handle = tar.extractfile(member)
                  if handle is None:
                      continue
                  payloads["maa/" + name[len(prefix):]] = handle.read()
          if not payloads:
              raise SystemExit(f"{tag} 里找不到绑定源码 {prefix}")

          dist_info = f"maafw-{version}.dist-info"
          payloads[f"{dist_info}/METADATA"] = (
              "Metadata-Version: 2.1\n"
              "Name: maafw\n"
              f"Version: {version}\n"
              "Summary: MaaFramework Python binding, rebuilt for Android from the upstream tag\n"
              "Requires-Python: >=3.9\n"
          ).encode()
          payloads[f"{dist_info}/WHEEL"] = (
              "Wheel-Version: 1.0\n"
              "Generator: m9a-android-ci\n"
              "Root-Is-Purelib: true\n"
              "Tag: py3-none-any\n"
          ).encode()
          records = []
          for path, data in sorted(payloads.items()):
              digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
              records.append(f"{path},sha256={digest},{len(data)}")
          records.append(f"{dist_info}/RECORD,,")
          payloads[f"{dist_info}/RECORD"] = ("\n".join(records) + "\n").encode()

          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "maafw-wheel"
          out.mkdir(parents=True, exist_ok=True)
          wheel = out / f"maafw-{version}-py3-none-any.whl"
          with zipfile.ZipFile(wheel, "w", zipfile.ZIP_DEFLATED) as wheel_zip:
              for path, data in sorted(payloads.items()):
                  wheel_zip.writestr(path, data)
          print(f"built {wheel} ({wheel.stat().st_size / 1024:.0f} KB, {len(payloads)} entries)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"wheel={wheel}\n")
          PY

      - name: Download and deploy MaaFramework
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAAFW_TAG: ${{ github.event.inputs.maafw_tag || steps.maafw.outputs.maafw_tag }}
        run: |
          TAG_ARG=""
          if [ -n "$MAAFW_TAG" ] && [ "$MAAFW_TAG" != "latest" ]; then
            TAG_ARG="--tag $MAAFW_TAG"
          fi
          python scripts/setup_maa_framework.py --abi arm64-v8a $TAG_ARG
          python scripts/setup_maa_framework.py --abi x86_64 $TAG_ARG

      - name: Build agent runtime
        working-directory: Android/MaaFwApp
        run: |
          if [ -x "${GITHUB_WORKSPACE}/Android/agent-dist/arm64-v8a/bundle/bin/python3" ] && \
             [ -x "${GITHUB_WORKSPACE}/Android/agent-dist/x86_64/bundle/bin/python3" ]; then
            echo "agent bundle cache hit"
            exit 0
          fi
          python scripts/build_agent_bundle.py \
            --out "${GITHUB_WORKSPACE}/Android/agent-dist" \
            --abi arm64-v8a --abi x86_64 \
            --requirements "${GITHUB_WORKSPACE}/requirements.txt" \
            --exclude pillow --require pillow==11.0.0 \
            --require "${{ steps.maafw-wheel.outputs.wheel }}" \
            --extra-index-url https://chaquo.com/pypi-13.1/

      # OCR 模型由 MaaCommonAssets 子模块提供、不进 git；与桌面流程同一机制，
      # 由 maa-project.json 的 ocr 字段驱动，无项目特定路径
      - name: Sync OCR models
        run: pnpm dlx create-maa-project@latest --update ocr-models

      - name: Write local.properties
        working-directory: Android/MaaFwApp
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "pi.profile=${PI_PROFILE}"
            if [ "$ASSEMBLE" != "release" ]; then
              echo "build.debugAbi=arm64-v8a"
            fi
          } > local.properties

      - name: Decode keystore
        if: env.ASSEMBLE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build Debug APK
        if: env.ASSEMBLE != 'release'
        working-directory: Android/MaaFwApp
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug

      - name: Build Release APK
        if: env.ASSEMBLE == 'release'
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Rename Release APK
        if: env.ASSEMBLE == 'release'
        env:
          LABEL: universal
        run: |
          cd Android/MaaFwApp/app/build/outputs/apk/release
          TAG="${GITHUB_REF_NAME:-dev}"
          TAG="${TAG//\//-}"
          count=$(ls -1 ./*.apk 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "预期恰好一个 release APK，实际 $count 个；多产物请改用按 ABI 命名"
            exit 1
          fi
          # universal 包不能被误认成单 ABI 包：应用内更新按 asset 名选包
          # （GitHubUpdate.selectAsset），带 ABI 标记就会绕过 universal 回退
          mv ./*.apk "M9A-${TAG}-${LABEL}.apk"

      - name: Upload Debug APK
        if: env.ASSEMBLE != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: Android/MaaFwApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: env.ASSEMBLE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-universal
          path: Android/MaaFwApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: env.ASSEMBLE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: Android/MaaFwApp/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  # release 时额外出单 ABI 包：每个 job 只铺/只打自己的 ABI，并把配方 agent.abi 收窄，
  # 于是 bundle.zip 里也只有这一份运行时，包体约为 universal 的一半
  abi-split:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.assemble == 'release') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      ABI: ${{ matrix.abi }}
      CACHE_SCOPE: ${{ matrix.abi }}
      PI_PROFILE: ${{ github.workspace }}/Android/profile-${{ matrix.abi }}.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Android/MaaFwApp/**/*.gradle.kts', 'Android/MaaFwApp/**/gradle-wrapper.properties', 'Android/MaaFwApp/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.abi }}-
            gradle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache agent core
        uses: actions/cache@v6
        with:
          path: Android/MaaFwApp/.maafw
          key: maa-agent-core-${{ runner.os }}-${{ env.CACHE_SCOPE }}-${{ hashFiles('Android/MaaFwApp/scripts/build_agent_bundle.py') }}

      - name: Cache agent bundle
        uses: actions/cache@v6
        with:
          path: Android/agent-dist
          key: m9a-agent-${{ runner.os }}-${{ env.CACHE_SCOPE }}-${{ hashFiles('requirements.txt', 'Android/MaaFwApp/scripts/build_agent_bundle.py') }}

      # client 侧（APK 里的 jniLibs）按桌面同一份 maa-project.json 的 maafw.channel/version
