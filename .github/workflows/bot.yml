name: Bot

# 一个 workflow 带两种任务：Issue 分析与 PR review。两者共用同一套工具链和评论通道，
# 差别只在材料准备和 prompt 里的判据。
#
# 写权限与 agent 分开：`analyze` 只有读权限，`post` 才持有 GitHub App 的 installation token。
# agent 读的是不可信的 Issue 正文和 diff，这样它就没有任何改 GitHub 的能力。
#
# 触发面：这个仓库自己的 PR 自动跑（草稿和 bot 提的除外），其余一律靠 `@M9ABot` 召唤。
# fork 的 PR 必须走召唤 —— `pull_request` 事件在 fork 上拿不到 secret，跑起来 agent 连不上模型；
# 而 `issue_comment` 始终在 base 仓库里执行，所以维护者一 @ 就能审。
#
# 发帖身份是 GitHub App，所以 `@M9ABot` 是一个真实账号：评论里 @ 它会被自动补全、渲染成链接
# （App 的 slug 是小写的，触发匹配特意不区分大小写）。installation token 只有 1 小时有效期，
# 所以它只在 `post` 里现签 —— agent 跑多久都不影响它。
#
# 工具链缓存写不进去与 `analyze` 的权限无关，是触发器决定的：低信任事件只拿到默认分支作用域的只读
# 缓存 token，所以那份缓存由 `.github/workflows/bot-cache.yml`（push / schedule / workflow_dispatch）喂。

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number
        required: true
        type: number
      kind:
        description: What to review
        required: true
        type: choice
        options: [issue, pr]

permissions:
  contents: read

jobs:
  gate:
    name: Decide what to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      target: ${{ steps.decide.outputs.target }}
      kind: ${{ steps.decide.outputs.kind }}
      # 有人在等回答（`@M9ABot` 召唤、或手动派发）时为 true —— 那时「没什么要说的」必须说出来，
      # 不像自动触发那样可以沉默。
      manual: ${{ steps.decide.outputs.manual }}
    steps:
      - id: decide
        env:
          DISPATCH_NUMBER: ${{ inputs.number }}
          DISPATCH_KIND: ${{ inputs.kind }}
          TRIGGER: "@M9ABot"
        run: |
          set -euo pipefail
          run=false
          target=""
          kind=""
          manual=false

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              run=true
              target="$DISPATCH_NUMBER"
              kind="$DISPATCH_KIND"
              manual=true
              ;;
            issues)
              target="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              kind=issue
              # 用 `labeled` 而不是 `opened`：Issue 模板在创建时就打上 `bug`，所以新的 bug 报告恰好触发
              # 一次；维护者判定某个已有 Issue 是 bug，或者摘掉标签再重新加上、要求再分析一遍时也会触发。
              label="$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")"
              if [ "$label" = "bug" ]; then
                run=true
              fi
              ;;
            issue_comment)
              target="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              # PR 就是带 `pull_request` 字段的 Issue，所以一个事件同时覆盖两者。
              kind="$(jq -r 'if .issue.pull_request then "pr" else "issue" end' "$GITHUB_EVENT_PATH")"
              body="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
              author="$(jq -r '.comment.user.type // ""' "$GITHUB_EVENT_PATH")"
              if printf '%s' "$body" | grep -qiF "$TRIGGER" && [ "$author" != "Bot" ]; then
                run=true
                manual=true
              fi
              ;;
            pull_request)
              target="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              kind=pr
              # 只处理本仓库自己的 PR。fork 的 `pull_request` 运行拿不到任何 secret，agent 连模型都连不上；
              # 在 PR 上召唤仍然可用，因为 `issue_comment` 在 base 仓库里执行。草稿要等
              # `ready_for_review`，而 bot 提的 PR 只是依赖噪音，没人想读它的 diff。
              same_repo="$(jq -r '.pull_request.head.repo.full_name == .pull_request.base.repo.full_name' "$GITHUB_EVENT_PATH")"
              draft="$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")"
              author="$(jq -r '.pull_request.user.type // ""' "$GITHUB_EVENT_PATH")"
              if [ "$same_repo" = "true" ] && [ "$draft" = "false" ] && [ "$author" != "Bot" ]; then
                run=true
              fi
              # fork PR 被跳过时，在运行页上留一句为什么：`Analyze` 和 `Post` 都会 skipped，两个 job 都发
              # 不出评论（fork 的 `pull_request` 运行没有任何 secret），而 step summary 不需要 secret。
              if [ "$same_repo" != "true" ]; then
                {
                  echo "### fork PR 不自动审查 / Fork PR is not reviewed automatically"
                  echo
                  echo '`pull_request` 在 fork 上拿不到任何 secret，agent 连不上模型，所以这里直接跳过。'
                  echo 'A `pull_request` run from a fork receives no repository secrets, so the agent cannot reach the model and this run is skipped.'
                  echo
                  echo "要审就在 PR 里评论 \`@M9ABot\`（\`issue_comment\` 在 base 仓库执行，secret 是齐的），或者手动派发 Bot workflow（number=$target、kind=pr）。"
                  echo "To request a review, comment \`@M9ABot\` in the PR (\`issue_comment\` runs in the base repository, where the secrets are), or dispatch the Bot workflow manually (number=$target, kind=pr)."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
          esac

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "manual=$manual" >> "$GITHUB_OUTPUT"
          echo "event=$GITHUB_EVENT_NAME target=$target kind=$kind run=$run manual=$manual"

  analyze:
    name: Analyze
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 并发放在这个 job 上，**不放 workflow 级** —— 那是 Sentry 在 PR #957 上指出的一条真 bug：
    # workflow 级的组会让「任意一条普通评论」起的运行也进来。它 gate 判成 run=false，自己什么都不做，
    # 却因为 `cancel-in-progress` 把正在跑的那一轮掐掉，于是那次召唤被静默丢弃。
    # 放在这里之后，run=false 的运行被上面的 `if` 直接跳过、从不排队，也就不会取消任何人；
    # 而重复召唤（两次 gate 都是 true）仍然是「最新那轮赢」。
    concurrency:
      group: bot-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
      cancel-in-progress: true
    # 故意只给读权限：agent 处理的 Issue 正文和 diff 都不可信，所以它没有任何写 GitHub 的途径。
    # 对外的发布全部走 `post`，那个 job 在发帖前一刻才签出自己的 App token。
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET: ${{ needs.gate.outputs.target }}
      # MEK 永远装最新 release（见安装步骤），所以运行内的自更新保持关闭：查到一半被换掉提取器，
      # 会让一份已经引用了证据 ID 的报告对不上号。新鲜度在 agent 启动前一次性决定，不在运行中决定。
      MAA_EVIDENCE_AUTO_UPDATE: "0"
      MAA_EVIDENCE_TELEMETRY: "0"
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      ANALYSIS_DIR: ${{ github.workspace }}/.analysis
      # App 自己的 bot 登录名，用来认出「上一轮是我们审的」。不能用 `user.type == "Bot"`：那会把这个
      # 仓库上的 sentry / CodeRabbit / Sourcery 一起命中，而它们在更晚的 commit 上留过 review 时，增量
      # 基线会被推到那个 commit，我们没看过的改动就被跳过了 —— 重复审可以接受，漏审不行。
      REVIEW_AUTHOR: "m9abot[bot]"
      # GraphQL 的 `author.login` 对 App 只给 slug，不带 `[bot]` 后缀（REST 的 `user.login` 才带）——
      # 同一个身份在两个接口里是两个名字，所以两个都要有。混用会让过滤永远匹配不到，而且是静默的。
      REVIEW_AUTHOR_SLUG: "m9abot"
      # 有人在等回答时为 true。自动触发（新 bug、PR 推送）可以一条都不发 —— 每推一次就回一句
      # 「本轮无问题」只是噪音；被点名时不行，那是在等人回答，沉默等于没响应。
      MANUAL: ${{ needs.gate.outputs.manual }}
    steps:
      # 故意拉全量历史。浅克隆照样能取到某个 tag 的文件内容，但取不到两个 tag 之间的区间 —— 而且它给
      # `git log <old>..<new>` 返回的是一个看起来合理的孤立 commit 而不是报错，这是错误答案里最糟的形态。
      # 定位修复 commit、进而得出「升级到 >= x」，都依赖那个区间。实测：14 s / 188 MB，对比 3.5 s / 26 MB。
      #
      # 工作树**刻意留在默认分支**，不切成 PR head。这份工作树里有三样东西是被执行的：`setup.json` 决定
      # npm 装什么（postinstall 就是任意代码）、`dsh-patch.yml` 决定 provider 指向哪（能带走
      # COMMAND_CODE_API_KEY）、`prompt.md` 直接就是 agent 的指令。而 `@M9ABot` 召唤那条路没有身份门槛，
      # 谁都能在自己的 fork PR 里改掉这三个文件再召唤 —— 切成 head 等于把执行路径交给对方。PR 的内容
      # 只以 ref 的形式取进来，见下面那步。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR 的 head 取成 ref 而不是工作树：`git diff` 直接可用，而上面那三个文件仍是默认分支的版本。
      # 自动（pull_request）、手动召唤、fork 三条路都靠这一步，`git fetch pull/<n>/head` 对三者同样成立。
      - name: Fetch the pull request head
        if: needs.gate.outputs.kind == 'pr'
        run: |
          set -euo pipefail
          git fetch --quiet origin "pull/$TARGET/head:refs/remotes/bot/pr-head"
          git log -1 --format='  pr head %h %s' refs/remotes/bot/pr-head

      # dsh 的 shell 环境是构造出来的、不是继承的（`dsh-shell-env` 只注册 `DSH_*` 事实，配置项只有
      # `dshHome`），所以 job 级 env 里的 `GH_TOKEN` 到不了 agent 手上。那个隔离本身是好事 —— 它同时让
      # agent 读不到自己正在烧的 `COMMAND_CODE_API_KEY`。但 issue 分析要读正文、评论和日志附件，还要对照
      # 历史 issue，`git` 给不了这些。
      #
      # 认证放在这里而不是让 agent 自己 `gh auth login`：agent 的 shell 跑在 workspace-write 沙箱里，
      # 写不了 `~/.config/gh`（实测 `mkdir /home/runner/.config/gh: permission denied`）。工作流自己的
      # shell 不受这个限制，凭证落进去之后 agent 只读它就行 —— 所以 prompt 里不必再教认证。
      #
      # `.gh-token` 留在仓库根是给 agent 的退路（沙箱若连读都拦，就用 `GH_TOKEN="$(cat .gh-token)" gh ...`）。
      # 放仓库根而不是 `$ANALYSIS_DIR`：后者会被 upload-artifact 连 token 一起打进去。
      - name: Authenticate gh with a read-only token
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" > .gh-token
          chmod 600 .gh-token
          # `gh auth login --with-token` 在 `GH_TOKEN` 已设时会拒绝落凭证，而 job 级 env 里就有它 ——
          # 所以只给这一条命令摘掉。落进 ~/.config/gh 之后，agent 那个没有 GH_TOKEN 的 shell 才用得上。
          env -u GH_TOKEN gh auth login --with-token < .gh-token
          # 这一条同样要摘掉 `GH_TOKEN`：带着它跑，`gh auth status` 报的是 job 级 env 里那份，并不证明
          # 凭证真的落进了 `~/.config/gh` —— 而 agent 靠的正是后者。摘掉之后它才是在验证这件事。
          env -u GH_TOKEN gh auth status

      # npm 是这个 job 唯一需要的包管理器。全新的 headless profile 只有 76 KB，自身不声明任何 bundle
      # 依赖；dsh 只在确实有东西要装时才去调包管理器 —— 实测首次启动，PATH 里有 pnpm 时 13.6 s，
      # 没有时 3.3 s。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Point npm globals at a writable prefix
        run: |
          set -euo pipefail
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # 包声明在 tools/bot/setup.json 里，改版本或加工具是改那个文件，不是改这里。
      #
      # 版本解析和缓存键都交给 `tools/bot/resolve-packages.sh`：`.github/workflows/bot-cache.yml` 必须
      # 算出逐字节相同的键，各写一遍就等于把「一处格式不一致」变成常态，而那种失败是静默的。
      - name: Resolve packages
        id: pkgs
        env:
          SETUP_HASH: ${{ hashFiles('tools/bot/setup.json') }}
        run: bash tools/bot/resolve-packages.sh

      # 有两样东西会让缓存树失效，原因各不相同。配置哈希：改名或删包会在 bin 里留下残留，下一次安装会
      # 因 EEXIST 直接失败 —— 而一个永不变化的 key 意味着这条缓存永不刷新，之后每次运行都会同样失败。
      # `cacheKey` 那一段版本号：`next` 移动时，交回来的树里应当已经带着新的 launcher。
      #
      # 这里只 restore，不 save：`issue_comment` / `issues` 是低信任触发器，GitHub 只给这类运行签默认
      # 分支作用域的**只读**缓存 token，保存必然以 `cache write denied: token has no writable scopes`
      # 收场 —— run 不失败，只留一条 warning，缓存却永远是空的。保存那半边在
      # `.github/workflows/bot-cache.yml`，那边由 push / schedule / workflow_dispatch 触发，也就是能写
      # 默认分支作用域的那批事件。
      #
      # Linux 实测：冷装这三个包 31–193 s 不等（网络差异很大；31 s 那次是 2026-10-10 首次 warm 运行，
      # `~/.npm-global` 还是空的）。缓存服务量到的是**归档** 146,083,121 字节 —— actions/cache 上传的是
      # zstd 压缩后的归档，不等于这棵树在磁盘上的大小，别拿 `du` 去对。命中缓存时 `Install toolchain`
      # 只剩版本检查（0.1 s）—— 那 0.1 s 成为常态的前提，正是有人先把 `~/.npm-global` 填进缓存。
      #
      # 不缓存 `$DSH_HOME/profiles/headless`：76 KB、首启动 3.3 s 就能重建，而 warm 那个 job 里没有模型
      # 凭证，不该为了这点体积让它把 dsh 整个跑一遍。
      - uses: actions/cache/restore@v6
        with:
          path: ~/.npm-global
          key: ${{ steps.pkgs.outputs.cache_key }}

      - name: Install toolchain
        run: bash tools/bot/install-toolchain.sh

      # agent 能拿到哪些 skill 由 tools/bot/setup.json 决定，每个来源都要声明它的 skill 怎么落地：
      # `committed` 已经在本仓库里，`package` 随某个 npm 包发布、由该包自己的 CLI 安装，`skills-cli`
      # 给出一个仓库名，交给 `skills` CLI 去装 —— 就是那些仓库给人看的那套工具。
      #
      # 不管来源是什么，装完都要在磁盘上核对一遍清单：少一个 skill 的 agent 照样会跑，只是答得更差，
      # 而这种失败在它产出的评论里完全看不出来。
      - name: Install and verify skills
        run: |
          set -euo pipefail
          cfg=tools/bot/setup.json

          # 用 `\x1f` 而不是制表符：bash 对 IFS 里的空白字符有特殊处理 —— 连续多个会折叠成一个分隔符 ——
          # 那样空的 `repo` 会把 `package` 挤到错误的变量里。
          while IFS=$'\x1f' read -r source type repo pkg; do
            case "$type" in
              committed) continue ;;
              package)
                binary="$(jq -r --arg k "$pkg" '.packages[] | select(.key == $k) | .binary' "$cfg")"
                install="$(jq -r --arg k "$pkg" '.packages[] | select(.key == $k) | .skillInstall' "$cfg")"
                check="$(jq -r --arg k "$pkg" '.packages[] | select(.key == $k) | .skillCheck' "$cfg")"
                pass="$(jq -r --arg k "$pkg" '.packages[] | select(.key == $k) | .skillCheckPass // ""' "$cfg")"
                echo "from package $pkg"
                # `< /dev/null` 让循环自己的输入不被任何读 stdin 的东西抢走。
                "$binary" $install < /dev/null
                # 判定由各包自己给出，因为这两个带 skill 的包并不一致：MEK 的 `--check` 永远退出 0，
                # 靠 JSON 报告结果；而 maafw-live 在漂移时退出 3。
                if [ -n "$pass" ]; then
                  "$binary" $check < /dev/null | tee "$RUNNER_TEMP/skill-check-$pkg.json"
                  if ! jq -e "$pass" "$RUNNER_TEMP/skill-check-$pkg.json" > /dev/null; then
                    echo "::error::the skill installed from $pkg does not match the CLI that will run"
                    exit 1
                  fi
                elif ! "$binary" $check < /dev/null; then
                  echo "::error::the skill installed from $pkg does not match the CLI that will run"
                  exit 1
                fi
                ;;
              skills-cli)
                args=()
                while read -r name; do args+=(-s "$name"); done \
                  < <(jq -r --arg s "$source" '.skills.list[] | select(.source == $s) | .name' "$cfg")
                echo "from $repo: ${args[*]}"
                # --copy：CLI 自己的那份 clone 一旦被清理，软链接就会断掉。
                npx -y skills@latest add "$repo" "${args[@]}" --copy -y < /dev/null
                ;;
              *)
                echo "::error::unknown source type '$type' for '$source' in $cfg"
                exit 1
                ;;
            esac
          done < <(jq -r '.skills.sources | to_entries[]
            | [.key, .value.type, (.value.repo // ""), (.value.package // "")] | join("\u001f")' "$cfg")

          missing=""
          while read -r name; do
            [ -f ".agents/skills/$name/SKILL.md" ] || missing="$missing $name"
          done < <(jq -r '.skills.list[].name' "$cfg")
          if [ -n "$missing" ]; then
            echo "::error::listed in tools/bot/setup.json but absent from .agents/skills/:$missing"
            exit 1
          fi
          echo "skills: $(jq -r '[.skills.list[] | "\(.name) (\(.source))"] | join(", ")' "$cfg")"

      # 复评只应覆盖上一次之后变化的部分，而 App 自己的 review 已经记录了它当时针对的 commit —— 所以基准
      # 从 GitHub 读回来，不在这里记。这一步只回答「从哪开始」；增量由 agent 自己去取，因为在
      # `issue_comment` 下 checkout 拿到的是默认分支，不是 PR 的 head。
      #
      # 分页交给 gh，用 `tail` 取最后一条匹配，这样无论接口按什么顺序返回 review 都成立。
      #
      # 兜底是给偶发 API 失败用的，目的不是把失败吞掉：`pipefail` 会让管道带上 gh 的退出码，没有兜底时
      # `set -e` 会判整个 job 失败，提问者收到的就是一条失败通知而不是 review。全量复评的代价只是重复
      # 评论，别的没有，所以它是更划算的落点。
      - name: Find the last review
        if: needs.gate.outputs.kind == 'pr'
        run: |
          set -euo pipefail
          base="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$TARGET/reviews" \
            | jq -r --arg who "$REVIEW_AUTHOR" '.[] | select(.user.login == $who) | .commit_id' | tail -1)" \
            || { echo "::warning::could not read the last review, reviewing the whole pull request"; base=""; }
          echo "last reviewed commit: ${base:-<none>}"

          # 光看 review 会把**已经判过、只是没说话**的提交重判一遍：沉默的轮次和失败的轮次都不留 review，
          # 于是基准不动、区间一直长。那次运行自己记得最后分析到哪 —— 上一次成功跑完这个 PR 的运行，它的
          # `head_sha` 就是最后一颗真正分析过的提交。
          #
          # 只认「那次运行的 `Analyze` job 真的跑成功过」，不能只看运行结论：`gate` 是唯一没有 `if` 的
          # job，**任何触发都会执行并成功**，而 `run=false` 时（草稿 PR、fork PR、bot 提的 PR）`analyze`
          # 被挡成 skipped —— 「success + skipped」的运行结论仍然是 `success`。把那种运行的 head_sha 当
          # 基准，会让草稿转正式、以及 fork PR 被召唤时增量为空，整个 PR 一次都不审。
          #
          # 逐个候选查 analyze 的结论，取第一个真跑成功的。取消 / 失败的运行也不是基准 —— 那些提交必须
          # 重来，失败能自愈靠的就是这个。
          #
          # 内层 gh 要 `< /dev/null`：它会读 stdin，而这里的 stdin 正是循环的来源。
          analyzed=""
          while read -r run_id sha; do
            [ -n "$run_id" ] || continue
            job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select(.name == "Analyze")][0].conclusion // ""' < /dev/null 2>/dev/null || true)"
            if [ "$job" = "success" ]; then
              analyzed="$sha"
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bot.yml/runs?status=success&per_page=60" \
            --jq "[.workflow_runs[] | select(any(.pull_requests[]?; .number == $TARGET))] | .[0:6][] | \"\(.id) \(.head_sha)\"" 2>/dev/null || true)

          if [ -n "$analyzed" ] && git cat-file -e "${analyzed}^{commit}" 2>/dev/null \
             && { [ -z "$base" ] || git merge-base --is-ancestor "$base" "$analyzed"; }; then
            # 只有当那次分析确实比最后一次发言更靠后时才采用它。
            if [ "$analyzed" != "$base" ]; then
              echo "last analysed commit: $analyzed (newer than the last review)"
            fi
            base="$analyzed"
          fi

          echo "REVIEW_BASE=$base" >> "$GITHUB_ENV"
          echo "base=$base"

          # 上一轮我们自己留下、还没被收起的行内意见，交给 agent 判断这次增量修掉了哪些。这份文件只是
          # **给 agent 读**的：它对 $ANALYSIS_DIR 有写权限，所以 post 侧不认这份，自己重新取一遍当白名单。
          mkdir -p "$ANALYSIS_DIR"
          if ! bash tools/bot/open-threads.sh > "$ANALYSIS_DIR/open-threads.json"; then
            echo "::warning::could not read the open review threads"
            echo '[]' > "$ANALYSIS_DIR/open-threads.json"
          fi
          echo "our open threads: $(jq 'length' "$ANALYSIS_DIR/open-threads.json" 2>/dev/null || echo '?')"

      - name: Analyze
        env:
          # 模型由 tools/bot/dsh-patch.yml 选定，那里把 command-code provider 指向这个环境变量名。
          # 换 key 是改 Settings，不需要提交。
          COMMAND_CODE_API_KEY: ${{ secrets.COMMAND_CODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$ANALYSIS_DIR"
          # 最终回复写到 `agent.out` 而不是 `answer.md`：两者都写同一个文件会有两个写者（shell 的重定向
          # 在步骤开始时就打开了 fd，agent 又在运行中改这个文件），谁后写谁赢 —— 而且它会让「沉默」失效，
          # 因为 dsh 的回复总会把 answer.md 填上。分开之后 answer.md 恰好是 agent 选择留下的全部内容：
          # 空 = 没什么值得说的。
          dsh --profile headless --patch tools/bot/dsh-patch.yml - < tools/bot/prompt.md \
            > "$ANALYSIS_DIR/agent.out" 2> "$ANALYSIS_DIR/agent.stderr"
          echo "--- agent stdout (tail) ---"
          tail -n 10 "$ANALYSIS_DIR/agent.out" || true
          echo "--- agent stderr (tail) ---"
          tail -n 40 "$ANALYSIS_DIR/agent.stderr" || true

      # 发布前仍设关卡的是 review 的载荷形状。Issue 分析原样发出：MEK 的证据纪律活在 agent 读的 Skill
      # 里，而在这里数证据 ID 是个很差的代理指标 —— 它的失效形态是「什么都不发」，比它想防的那段话更糟。
      - name: Validate the output
        env:
          KIND: ${{ needs.gate.outputs.kind }}
        run: |
          set -euo pipefail
          answer="$ANALYSIS_DIR/answer.md"
          # 空答案在自动触发下是**合法结果**：没什么值得说的就不说话。`dsh` 失败走的是另一条路
          # （Analyze 步骤自己会失败，`post` 因此拿不到 success），所以这里空着不等于出错。
          # 被点名时不行 —— 有人在等回答。
          if [ ! -s "$answer" ]; then
            if [ "$MANUAL" = "true" ]; then
              echo "::error::agent produced no answer, but someone asked for one"
              exit 1
            fi
            echo "nothing worth saying — staying silent"
            exit 0
          fi
          if [ "$KIND" != "pr" ]; then
            exit 0
          fi
          # 没有值得挂行的 review 也是合法 review，所以文件缺失和空列表都通过 —— prompt 说的是「有值得
          # 逐行说的问题时才另写」，把可选写成必填会让一篇没有行内意见的 review 连正文都发不出去。
          # 格式坏掉的文件不行：它会静默地以「没找到评论」的样子发出去。
          if [ -f "$ANALYSIS_DIR/review.json" ] &&
             ! jq -e '.comments | type == "array"' "$ANALYSIS_DIR/review.json" > /dev/null 2>&1; then
            echo "::error::review.json exists but does not hold a comments array"
            exit 1
          fi
          echo "inline comments proposed: $(jq '.comments | length' "$ANALYSIS_DIR/review.json" 2>/dev/null || echo 0)"

      # 会话日志里有每步的 token 用量（`assistant/chunk` 的 `type: usage`），但它在 `$DSH_HOME` 下、
      # 是 zstd 多帧、而且没有任何 CLI 出口 —— 不导出就无从查起。这一步把用量汇总成 `usage.json` 落进
      # artifact，同时打到运行日志里，省得每次都去解压几万个 frame。
      #
      # `if: always()`：`dsh` 中途失败时，已经烧掉的量正是最需要看到的。
      #
      # 数据源在 agent 可写的目录里，所以它是**观测**而不是账单 —— 能反映用量，但不能当审计依据。
      - name: Summarize token usage
        if: always()
        run: |
          set -euo pipefail
          node tools/bot/session-usage.mjs "$DSH_HOME/sessions" "$ANALYSIS_DIR/usage.json"

      # 只有校验过的产物会离开这个 job；能写的 token 在下一个 job 里。
      #
      # 会话日志一并带走：它是唯一记录 agent 每一步做了什么的地方（工具调用、结果、用量），
      # 而 `agent.stderr` 只有推理文本。
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bot-output
          path: |
            ${{ env.ANALYSIS_DIR }}
            ${{ env.DSH_HOME }}/sessions
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  post:
    name: Post
    needs: [gate, analyze]
    if: always() && needs.gate.outputs.run == 'true' && needs.analyze.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 挂行内评论需要 `pull-requests: write`，而这个权限同时也允许批准或要求修改。只靠载荷把它保持在
    # 建议性质：review 以 `event: COMMENT` 发出，任何 token 权限都变不成结论。
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TARGET: ${{ needs.gate.outputs.target }}
      KIND: ${{ needs.gate.outputs.kind }}
      ANALYSIS_DIR: ${{ github.workspace }}/.analysis
      # 这个 job 必须跑起来才能发出失败通知，所以它不能靠 `if` 去挡失败的 analyze —— 于是把结果传进来，
      # 由发布步骤自己判。少了这个，`dsh` 中途失败但 answer.md 已写了一半时，半成品会被当成正常结论发出。
      ANALYZE_RESULT: ${{ needs.analyze.result }}
      # 与 analyze 侧同一个来源：空答案是合法结果，只有被点名时才必须出声。
      MANUAL: ${{ needs.gate.outputs.manual }}
      # `open-threads.sh` 要用它过滤出我们自己的 thread。GraphQL 的 author.login 只给 slug（见
      # analyze 那边同名变量的注释）。
      REVIEW_AUTHOR_SLUG: "m9abot"
    steps:
      # 这里**不**指定 ref，保持 checkout 的默认行为。曾经想显式检出默认分支，好让这个 job 执行的
      # `tools/bot/*`（`review-lines.awk`、`open-threads.sh`）不是 PR 能改的那份 —— 但那既没用也有害：
      # `pull_request` 事件下 workflow 文件本身就取自 merge ref，同仓库 PR 的作者本来就控制着整条流程，
      # 只挡住 checkout 不构成屏障；而 `issue_comment`（fork 那条路）下 checkout 本来就是默认分支，改动
      # 在那里是 no-op。有害的部分是它连新的 `tools/bot/*` 都拿不到 —— 文件还没合并进默认分支。
      - uses: actions/checkout@v7

      # installation token 一小时后过期，而分析允许跑得比这更久。只在负责发帖的 job 里现签，token 的
      # 寿命就与 agent 跑了多久无关。
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
          # `resolveReviewThread` 对 App installation token 要求 `contents: write`：只给
          # `pull-requests: write` 会拿到 `Resource not accessible by integration`（实测同一个 thread
          # 用维护者 token 能收、用 App token 不能）。
          #
          # 这个权限同时覆盖 commits / branches / releases / merges —— 也就是 bot 能发版。维护者知情
          # 并选择接受：自动收起已修意见要它，而 App 这条路没有更窄的替代（细粒度 PAT 可以只给
          # pull requests，代价是另一个会过期的 secret）。
          #
          # 所以防线在别处：`gate` 只放行本仓库自己的 PR（同仓库 PR 的作者本来就能改这个 workflow
          # 文件），并且 **App 不应出现在 main 的绕过名单里** —— 否则这里等于给协作者开了直接推送。
          permission-contents: write

      # 下载到 workspace 而不是 `$ANALYSIS_DIR`：`upload-artifact` 在有两个及以上 `path` 时，会把
      # artifact 的根抬到它们的**最近公共祖先**（这里是 workspace），于是内部结构是 `.analysis/…`
      # 与 `.dsh-home/…`。下载到 `$ANALYSIS_DIR` 就会变成 `$ANALYSIS_DIR/.analysis/answer.md`，
      # 而 `Post the answer` 找的是 `$ANALYSIS_DIR/answer.md` —— 一条都发不出去。
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: bot-output
          path: ${{ github.workspace }}

      - name: Post the answer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          answer="$ANALYSIS_DIR/answer.md"

          # 分析没成功就不发布。`answer.md` 非空不等于分析完成 —— `dsh` 中途失败时会留下一份写了一半
          # 的文件，而 `Validate` 在没有 review.json 时是放行的，两条合起来足以让半成品当成结论发出去。
          # 在这里失败会把解释交给下面那一步，于是一次失败运行只有一条通知路径。
          if [ "$ANALYZE_RESULT" != "success" ]; then
            echo "::error::the analysis job did not succeed ($ANALYZE_RESULT)"
            exit 1
          fi

          # 产物没到 ≠ 没什么值得说的：前者要吵，后者要静。`agent.stderr` 每次运行都会有（agent 的
          # 诊断输出总会写），用它区分 —— 少了它说明 artifact 压根没下来（上传/下载的目录层级对不上
          # 之类），而不是 agent 决定不说。少了这一条，一次下载路径错误会被"空答案即沉默"吞掉。
          if [ ! -f "$ANALYSIS_DIR/agent.stderr" ]; then
            echo "::error::the analysis artifact did not arrive at $ANALYSIS_DIR"
            exit 1
          fi

          # 收起 agent 确认已经修掉的旧意见。定义成函数是因为它有**两个**调用点：发完 review 之后，
          # 以及沉默轮 —— 沉默轮往往正是「只修掉了旧意见」的那一轮，prompt 让那种轮次留空 `answer.md`、
          # 只把 `resolved` 写进 `review.json`；少了沉默分支那一次调用，这件事永远不会发生。
          #
          # 白名单**在这里重新取**，不读 artifact 里那份：agent 对 $ANALYSIS_DIR 有写权限（沙箱根就是
          # 仓库根），它能改写 analyze 留下的那份来放宽约束，而伪造的 id 用只读 token 就查得到。取不到
          # 就整段跳过 —— 宁可不收，也不收错。
          #
          # stderr 不重定向：这里失败过一轮而现场被丢进 /dev/null，只能回头翻代码猜。
          #
          # `resolveReviewThread` 要求 App installation token 带 `contents: write`（只有
          # `pull-requests: write` 会拿到 `Resource not accessible by integration`），所以上面签 token 时
          # 请求了它 —— 那份权限的代价与前提记在那一处。
          #
          # resolve 失败只告警：这一轮的 review 已经发出去了（或本来就该沉默），没有理由因为它把整步
          # 判失败，让读者再收到一条「分析未完成」。
          resolve_threads() {
            local open="$RUNNER_TEMP/open-threads.json"
            if bash tools/bot/open-threads.sh > "$open"; then
              local resolved attempted=0 done_count=0
              resolved="$(jq -r --slurpfile open "$open" \
                '(.resolved // [])[] as $want | select($open[0] | any(.id == $want)) | $want' \
                "$ANALYSIS_DIR/review.json" 2>/dev/null || true)"
              for id in $resolved; do
                attempted=$((attempted + 1))
                if gh api graphql \
                    -f query='mutation($id: ID!) { resolveReviewThread(input: { threadId: $id }) { thread { isResolved } } }' \
                    -F id="$id" > /dev/null; then
                  echo "resolved $id"
                  done_count=$((done_count + 1))
                else
                  echo "::warning::could not resolve $id"
                fi
              done
              echo "resolved $done_count of $attempted proposed, out of $(jq 'length' "$open" 2>/dev/null || echo '?') open threads"
            else
              echo "::warning::could not read our open threads, resolving nothing"
            fi
          }

          # 空答案 = 没什么值得说的。自动触发下安静退出，一条都不发；被点名时不能沉默，那是有人在等
          # 回答，所以判失败、交给下面那一步说明。
          if [ ! -s "$answer" ]; then
            if [ "$MANUAL" = "true" ]; then
              echo "::error::no answer to publish, but someone asked for one"
              exit 1
            fi
            echo "nothing worth saying — not posting"
            resolve_threads
            exit 0
          fi

          if [ "$KIND" != "pr" ]; then
            gh issue comment "$TARGET" --body-file "$answer"
            exit 0
          fi

          # GitHub 只接受落在当前 diff 所含行上的行内评论，而一个已经过期、不再属于当前修订的位置会让
          # 整个 review 被拒。先按 diff 过滤，再一次发帖，让摘要和行内评论作为同一条 review 到达。
          #
          # agent 可以合法地不写 review.json（prompt 把它定为可选），所以缺失按空列表处理 —— 否则下面
          # 每条 jq 都会因文件不存在退出，整篇 review 变成一条「分析未完成」。
          review="$ANALYSIS_DIR/review.json"
          [ -f "$review" ] || echo '{"comments": []}' > "$review"
          # `LC_ALL=C` 是必须的：`review-lines.awk` 要把 git 的八进制转义还原成原始字节，而 UTF-8
          # locale 下 `printf "%c", 228` 输出的是 U+00E4 的多字节编码，不是那个字节 —— 路径就还是对不上。
          gh pr diff "$TARGET" | LC_ALL=C awk -f tools/bot/review-lines.awk | sort -u > "$RUNNER_TEMP/lines.txt"
          total="$(jq '.comments | length' "$review")"
          if ! jq --rawfile valid "$RUNNER_TEMP/lines.txt" '
            ($valid | split("\n") | map(select(length > 0)) | reduce .[] as $l ({}; .[$l] = true)) as $ok
            | {comments: [.comments[] | select($ok[[.path, (.line | tostring)] | join("\t")])]}
          ' "$review" > "$RUNNER_TEMP/comments.json"; then
            echo "::warning::could not filter inline comments, posting the summary alone"
            echo '{"comments": []}' > "$RUNNER_TEMP/comments.json"
          fi

          kept="$(jq '.comments | length' "$RUNNER_TEMP/comments.json")"
          echo "inline comments: $kept kept, $((total - kept)) dropped as not in the diff"
          if [ "$total" -gt 0 ] && [ "$kept" -eq 0 ]; then
            echo "::warning::every proposed inline comment was outside the diff"
          fi

          jq -n --rawfile body "$answer" --slurpfile c "$RUNNER_TEMP/comments.json" \
            '{event: "COMMENT", body: $body, comments: $c[0].comments}' > "$RUNNER_TEMP/review.json"

          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$TARGET/reviews" --input "$RUNNER_TEMP/review.json"; then
            echo "::warning::review rejected with inline comments, retrying as a summary-only review"
            jq -n --rawfile body "$answer" '{event: "COMMENT", body: $body, comments: []}' \
              > "$RUNNER_TEMP/review.json"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$TARGET/reviews" --input "$RUNNER_TEMP/review.json"
          fi

          # 收起 agent 确认已经修掉的旧意见。放在发完 review 之后：先让这一轮的结论可见，再动旧的。
          # （另一个调用点在上面沉默分支里 —— 那正是「只修掉了旧意见」的轮次会走的路。）
          resolve_threads

      # 没有这一步，一次已经过了 gate 却中途失败的运行就是沉默的：提问者什么都看不到，也分不清 bot 是
      # 死了还是压根没跑。token 回退到 Actions 那个，这样连 App 配错也至少能出一句话。
      #
      # `gate` 内部失败够不着 —— 这个 job 的 `if` 需要 `run` 输出，而要发到哪个号也是 gate 给的。这个
      # 代价可以接受：gate 只读四个事件必然携带的字段，而且 gate 坏掉表现为一次红叉运行，而不是对一个
      # 没人在等的 PR 保持沉默。
      - name: Report a failed publish
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 用 printf 而不是 heredoc：YAML 块缩进会作为前导空格一起发出去，把每一行都变成 Markdown
          # 代码块。
          gh issue comment "$TARGET" --body "$(printf '%s\n' \
            '## 分析未完成' \
            '' \
            '本次没有产出可发布的结论。' \
            '' \
            '- 阻断环节：见本次 Actions 运行记录' \
            '- 建议：稍后评论 `@M9ABot` 重新触发')"
