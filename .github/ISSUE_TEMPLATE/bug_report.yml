name: Bug 反馈 / Bug Report
description: 识别错误、操作异常、崩溃、连接问题等 / Recognition, operation, crash, or connection problems
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before Submitting
      description: 请确认以下内容后再提交 / Please confirm the following before submitting.
      options:
        - label: 我已经更新到当前最新版本，并确认问题仍然存在 / I have updated to the latest version and confirmed the issue still exists
          required: true
        - label: 我已经搜索过现有和已关闭的 Issue，确认没有重复报告 / I have searched open and closed issues for duplicates
          required: true
        - label: 我填写了简短清晰的标题，而不是“卡住了”“有问题”等模糊描述 / I used a short and specific title
          required: true
        - label: 我会上传完整日志文件，而不是只粘贴片段或截图日志 / I will attach complete log files instead of snippets or screenshots of logs
          required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: 问题类型 / Issue Type
      options:
        - 一般 Bug / General Bug
        - 崩溃 / Crash
        - 识别问题 / Recognition Issue
        - 任务流程问题 / Task or Pipeline Issue
        - 连接或控制器问题 / Connection or Controller Issue
        - 打包或发布问题 / Packaging or Release Issue
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description and Reproduction
      description: 请写清预期行为、实际行为和复现步骤 / Describe expected behavior, actual behavior, and reproduction steps.
      placeholder: |
        预期行为 / Expected:
        实际行为 / Actual:
        复现步骤 / Steps:
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: project_version
    attributes:
      label: "M9A 版本 / M9A Version"
      placeholder: "例如 / e.g.: v0.1.0"
    validations:
      required: true

  - type: input
    id: runtime_version
    attributes:
      label: MaaFramework 版本 / MaaFramework Version
      placeholder: "例如 / e.g.: v5.10.5"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 操作系统、控制器、模拟器或设备、分辨率、DPI、运行方式等 / OS, controller, emulator or device, resolution, DPI, launch method, etc.
      placeholder: |
        OS:
        Controller:
        Emulator/Device:
        Resolution/DPI:
    validations:
      required: true

  - type: textarea
    id: related_task
    attributes:
      label: 相关任务 / Related Task
      description: |
        问题发生在哪个任务或功能上？请填写在界面上选择的任务名称，以及进行到哪一步时出错。
        Which task or feature did the problem occur on? Give the task name as shown in the app and the step where it went wrong.
        如果是在编写或修改 pipeline / 资源包时遇到的问题，请注明相关节点名称。
        If you were authoring or modifying a pipeline / resource pack, name the relevant nodes instead.
      placeholder: |
        任务名称 / Task name:
        出错步骤 / Failing step:
    validations:
      required: false

  - type: input
    id: issue_time
    attributes:
      label: 问题出现时间 / When It Happened
      description: 尽量精确到日期和时间，用于在日志中定位事发记录；每次复现可写“每次” / Date and time as precisely as you can, used to locate the moment in the logs; write "always" if it happens every run.
      placeholder: "例如 / e.g.: 2026-10-01 14:30"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志文件 / Log Files
      description: |
        请上传完整的日志文件（体积过大可压缩为 zip），而不是只粘贴片段或截图日志。
        Please attach complete log files (zip them if too large) instead of snippets or screenshots of logs.

        本地运行：请打包上传整个 debug/ 目录，若启动器或自定义程序还写入了 logs/ 等其他日志目录，请一并打包。至少包含 debug/maafw.log；如果存在带时间戳的 debug/maafw.bak.<时间戳>.log，请一并上传，事发记录可能已经轮转进备份文件。Agent 项目的 MaaFW 内核日志在 debug/agent/maafw.log；macOS 的 MXU 客户端把该目录放在 ~/Library/Application Support/MXU，对应日志是 ~/Library/Application Support/MXU/debug/agent/maafw.log。
        Local run: pack and upload the entire debug/ directory, plus any other log directories such as logs/ written by your launcher or custom programs. Include at least debug/maafw.log, and the timestamped debug/maafw.bak.<timestamp>.log as well when it exists — the moment in question may already have rotated into the backup. Agent projects keep their MaaFW core log at debug/agent/maafw.log; the macOS MXU client puts its debug directory under ~/Library/Application Support/MXU, so the log is ~/Library/Application Support/MXU/debug/agent/maafw.log.

        由 GUI 导出：请上传导出的日志压缩包；如果分成多个文件或分卷，请全部上传，缺少任何一部分都可能丢失事发记录。
        Exported by a GUI: upload the exported log archive; if it is split into multiple files or parts, upload every one of them — a single missing part can lose the moment in question.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图、录屏或调试图片 / Screenshots, Recordings, or Debug Images
      description: |
        识别问题请尽量提供原始截图、debug/vision 图片、模板图片路径和 ROI。
        For recognition issues, provide original screenshots, debug/vision images, template paths, and ROI when possible.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他信息 / Additional Information
      description: 最小复现项目、Actions 链接、崩溃 dump、配置文件等 / Minimal reproduction, Actions links, crash dumps, config files, etc.
    validations:
      required: false
